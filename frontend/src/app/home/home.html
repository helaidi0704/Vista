<div class="layout">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-logo">
      <div class="logo-icon">
        <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
          <rect x="4" y="4" width="20" height="20" rx="4" stroke="var(--accent)" stroke-width="2" />
          <circle cx="14" cy="14" r="5" stroke="var(--green)" stroke-width="2" />
          <circle cx="21" cy="7" r="1.5" fill="var(--accent)" />
        </svg>
      </div>
      <span class="logo-text">VISTA</span>
    </div>

    <nav class="sidebar-nav">
      <a class="nav-item" [class.active]="currentPage() === 'accueil'" data-page="home" (click)="setPage('accueil')">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z" />
          <polyline points="9,22 9,12 15,12 15,22" />
        </svg>
        <span>Accueil</span>
      </a>
      <a class="nav-item" [class.active]="currentPage() === 'annotation'" data-page="viewer" (click)="setPage('annotation')">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="3" width="18" height="18" rx="2" />
          <circle cx="8.5" cy="8.5" r="1.5" />
          <polyline points="21,15 16,10 5,21" />
        </svg>
        <span>Visualiseur & Annotation</span>
        <span class="nav-badge">1</span>
      </a>
      <a class="nav-item" [class.active]="currentPage() === 'analyse'" data-page="analyse" (click)="setPage('analyse')">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path
            d="M21 16V8a2 2 0 00-1-1.73l-7-4a2 2 0 00-2 0l-7 4A2 2 0 003 8v8a2 2 0 001 1.73l7 4a2 2 0 002 0l7-4A2 2 0 0021 16z">
          </path>
          <polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline>
          <line x1="12" y1="22.08" x2="12" y2="12"></line>
        </svg>
        <span>Analyse & Comparaison</span>
        <span class="nav-badge">2</span>
      </a>
      <a class="nav-item" [class.active]="currentPage() === 'training'" data-page="training" (click)="setPage('training')">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="2" y="3" width="20" height="14" rx="2" />
          <path d="M8 21h8M12 17v4" />
        </svg>
        <span>Entraînement de Modèles</span>
        <span class="nav-badge">3</span>
      </a>
      <a class="nav-item" [class.active]="currentPage() === 'testing'" data-page="testing" (click)="setPage('testing')">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
          <circle cx="12" cy="13" r="4"></circle>
        </svg>
        <span>Test en live & Explicabilité</span>
        <span class="nav-badge">4</span>
      </a>
      <a class="nav-item" [class.active]="currentPage() === 'deployment'" data-page="deployment" (click)="setPage('deployment')">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 2L2 7l10 5 10-5-10-5z" />
          <path d="M2 17l10 5 10-5" />
          <path d="M2 12l10 5 10-5" />
        </svg>
        <span>Déploiement</span>
        <span class="nav-badge">5</span>
      </a>
    </nav>

    <div class="sidebar-footer">
      <div class="user-chip">
        <div class="user-avatar">M</div>
        <div class="user-info">
          <span class="user-name">M. Seddar</span>
          <span class="user-role">Ingénieur Vision IA</span>
        </div>
      </div>
    </div>
  </aside>

  <main class="main-content" id="main-content">
    <header class="topbar">
      <div class="topbar-left">
        <h1 class="page-title" id="page-title">Accueil</h1>
      </div>
      <div class="topbar-right">
        <div class="status-chip"><span class="status-dot"></span>Système actif</div>
        <button class="icon-btn" title="Notifications">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9" />
            <path d="M13.73 21a2 2 0 01-3.46 0" />
          </svg>
        </button>
        <button class="icon-btn" title="Paramètres">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="3" />
            <path
              d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a1.65 1.65 0 010 2.33 1.65 1.65 0 01-2.33 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a1.65 1.65 0 01-3.3 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a1.65 1.65 0 01-2.33-2.33l.06-.06A1.65 1.65 0 005.18 15a1.65 1.65 0 00-1.51-1H3a1.65 1.65 0 010-3.3h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a1.65 1.65 0 012.33-2.33l.06.06A1.65 1.65 0 009 5.18a1.65 1.65 0 001-1.51V3a1.65 1.65 0 013.3 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a1.65 1.65 0 012.33 2.33l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a1.65 1.65 0 010 3.3h-.09a1.65 1.65 0 00-1.51 1z" />
          </svg>
        </button>
      </div>
    </header>

    <div class="page" [class.active]="currentPage() === 'accueil'" id="page-home">
      <app-accueil *ngIf="currentPage() === 'accueil'"></app-accueil>
    </div>
    <div class="page" [class.active]="currentPage() === 'annotation'" id="page-viewer">
      <app-annotation *ngIf="currentPage() === 'annotation'"></app-annotation>
    </div>
        <div class="page" [class.active]="currentPage() === 'analyse'" id="page-analysis">
      <app-analyze *ngIf="currentPage() === 'analyse'"></app-analyze>
    </div>
    <div class="page" [class.active]="currentPage() === 'training'" id="page-training">
      <app-training *ngIf="currentPage() === 'training'"></app-training>
    </div>
    <div class="page" [class.active]="currentPage() === 'testing'" id="page-testing">
      <app-testing *ngIf="currentPage() === 'testing'"></app-testing>
    </div>
    <div class="page" [class.active]="currentPage() === 'deployment'" id="page-deployment">
      <app-deployment *ngIf="currentPage() === 'deployment'"></app-deployment>
    </div>
  </main>
</div>
