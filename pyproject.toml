[project]
name = "vista-monorepo"
version = "0.1.0"
description = "VISTA: Visual Inspection for Smart Trial Applications"
authors = [
    { name = "VISTA Team" }
]
requires-python = "==3.12.8"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.23.2",
    "celery>=5.3.4",
    "redis>=5.0.1",
    "psycopg2-binary>=2.9.9",
    "sqlalchemy>=2.0.23",
    "pydantic>=2.4.2",
    "pydantic-settings>=2.0.3",
    "opencv-python>=4.9.0.80",
    "Pillow>=10.2.0",
    "albumentations>=1.4.0",
    "numpy>=1.26.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.2",
    "pytest-cov>=4.1.0",
    "black>=23.9.1",
    "ruff>=0.0.292",
    "flake8>=6.1.0",
    "httpx>=0.25.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.black]
line-length = 88
target-version = ['py312']
include = '\.pyi?$'

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.uv]
package = false
