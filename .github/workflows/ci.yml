name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Install uv and deps
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - name: Run Pytest
        run: |
          uv run pytest tests/unit

  test-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: "18"
      - name: Install dependencies
        run: |
          cd apps/annotation-ui
          npm ci || npm install
      - name: Run ESLint
        run: |
          cd apps/annotation-ui
          npm run lint || echo "No lint script yet"
