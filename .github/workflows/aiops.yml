name: CI/CD VISTA (DEV IBRAHIM)

on:
  push:
    branches:
      - dev-ibrahim
      - develop

  workflow_dispatch:

env:
  DOCKER_COMPOSE_FILE: ./infra/infra/docker/docker-compose.yml
  ENV_FILE: ./infra/.env

jobs:

  ci:

    runs-on: ubuntu-latest

    steps:

      # ----------------------
      # CHECKOUT
      # ----------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ----------------------
      # NODE
      # ----------------------
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # ----------------------
      # PYTHON
      # ----------------------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ----------------------
      # FRONTEND INSTALL
      # ----------------------
      - name: Install frontend
        run: |
          cd frontend
          npm install --legacy-peer-deps

      # ----------------------
      # FRONTEND BUILD
      # ----------------------
      - name: Build frontend
        run: |
          cd frontend
          npm run build --if-present

      # ----------------------
      # ENV CONFIG
      # ----------------------
      - name: Create env file
        run: |
          mkdir -p infra

          echo "DB_NAME=postgres" > $ENV_FILE
          echo "DB_USER=postgres" >> $ENV_FILE
          echo "DB_PASSWORD=postgres" >> $ENV_FILE
          echo "DB_PORT=5432" >> $ENV_FILE

      # ----------------------
      # DOCKER BUILD
      # ----------------------
      - name: Docker build
        run: |
          docker compose \
            --env-file $ENV_FILE \
            -f $DOCKER_COMPOSE_FILE \
            build

      # ----------------------
      # DOCKER UP
      # ----------------------
      - name: Docker up
        run: |
          docker compose \
            --env-file $ENV_FILE \
            -f $DOCKER_COMPOSE_FILE \
            up -d

      # ----------------------
      # WAIT SERVICES
      # ----------------------
      - name: Wait for services
        run: |
          echo "Waiting for services..."
          sleep 30

      # ----------------------
      # CHECK CONTAINERS
      # ----------------------
      - name: Check containers
        run: docker ps

      # ----------------------
      # DOCKER LOGS
      # ----------------------
      - name: Show logs
        run: |
          docker compose \
            --env-file $ENV_FILE \
            -f $DOCKER_COMPOSE_FILE \
            logs

      # ----------------------
      # TEST API
      # ----------------------
      - name: Test API
        run: |
          curl -f http://localhost:8000

      # ----------------------
      # TEST FRONTEND
      # ----------------------
      - name: Test Frontend
        run: |
          curl -f http://localhost:4200

      # ----------------------
      # PLAYWRIGHT
      # ----------------------
      - name: Run Playwright tests
        continue-on-error: true
        run: |
          docker compose \
            --env-file $ENV_FILE \
            -f $DOCKER_COMPOSE_FILE \
            run playwright \
            > playwright.log 2>&1

      # ----------------------
      # COLLECT LOGS
      # ----------------------
      - name: Collect logs
        if: always()
        run: |
          mkdir -p logs

          docker compose \
            --env-file $ENV_FILE \
            -f $DOCKER_COMPOSE_FILE \
            logs > logs/docker.log 2>&1 || true

          cp playwright.log logs/playwright.log || true

      # ----------------------
      # INSTALL AIOPS
      # ----------------------
      - name: Install AIOps dependencies
        if: always()
        run: |
          pip install -r vista-aiops/requirements.txt

      # ----------------------
      # RUN AIOPS
      # ----------------------
      - name: Vista-AIOps Analysis
        if: always()
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          cd vista-aiops
          python cli.py diagnose-log ../logs/docker.log

      # ----------------------
      # UPLOAD LOGS
      # ----------------------
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vista-logs
          path: logs/

      # ----------------------
      # UPLOAD AIOPS REPORT
      # ----------------------
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aiops-report
          path: vista-aiops/reports/

      # ----------------------
      # CLEANUP
      # ----------------------
      - name: Docker down
        if: always()
        run: |
          docker compose \
            --env-file $ENV_FILE \
            -f $DOCKER_COMPOSE_FILE \
            down -v
