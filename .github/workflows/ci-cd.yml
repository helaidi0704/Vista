name: CI/CD VISTA (DEV IBRAHIM)

on:
  push:
    branches:
      - dev-ibrahim
  workflow_dispatch:

env:
  DOCKER_COMPOSE_FILE: ./infra/infra/docker/docker-compose.yml

jobs:

  ci:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      # ----------------------
      # FRONTEND
      # ----------------------
      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Install frontend
        run: |
          cd frontend
          npm install --legacy-peer-deps

      - name: Build frontend
        run: |
          cd frontend
          npm run build --if-present

      # ----------------------
      # CREATE ENV (FIX FINAL ✅)
      # ----------------------
      - name: Create env file in infra/infra/
        run: |
          mkdir -p infra/infra
          echo "DB_NAME=postgres" >> infra/infra/.env
          echo "DB_USER=postgres" >> infra/infra/.env
          echo "DB_PASSWORD=postgres" >> infra/infra/.env
          echo "DB_PORT=5432" >> infra/infra/.env

      # ----------------------
      # DEBUG
      # ----------------------
      - name: Debug paths
        run: |
          ls -R infra

      # ----------------------
      # DOCKER BUILD
      # ----------------------
      - name: Docker build
        run: |
          docker compose -f $DOCKER_COMPOSE_FILE build

      # ----------------------
      # RUN
      # ----------------------
      - name: Docker up
        run: |
          docker compose -f $DOCKER_COMPOSE_FILE up -d

      - name: Check containers
        run: docker ps

      - name: Docker down
        run: |
          docker compose -f $DOCKER_COMPOSE_FILE down
