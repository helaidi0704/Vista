name: CI/CD VISTA (DEV IBRAHIM)

on:
  push:
    branches:
      - dev-ibrahim
  pull_request:
    branches:
      - dev-ibrahim
  workflow_dispatch:

env:
  DOCKER_COMPOSE_FILE: infra/docker/docker-compose.yml

jobs:

  ci:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      # ----------------------
      # CHECKOUT
      # ----------------------
      - name: Checkout repository
        uses: actions/checkout@v3

      # ----------------------
      # FRONTEND (Angular)
      # ----------------------
      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm install --legacy-peer-deps

      - name: Build frontend
        run: |
          cd frontend
          npm run build --if-present

      # ----------------------
      # BACKEND (FastAPI)
      # ----------------------
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        run: |
          cd services/api
          pip install -r requirements.txt

      - name: Run backend tests
        run: |
          cd services/api
          pytest || echo "No tests yet"

      # ----------------------

