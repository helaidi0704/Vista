name: CI/CD VISTA (DEV IBRAHIM)

on:
  push:
    branches:
      - dev-ibrahim
  workflow_dispatch:

env:
  DOCKER_COMPOSE_FILE: ./infra/infra/docker/docker-compose.yml
  ENV_FILE: ./infra/infra/.env

jobs:

  ci:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      # ----------------------
      # FRONTEND
      # ----------------------
      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Install frontend
        run: |
          cd frontend
          npm install --legacy-peer-deps

      - name: Build frontend
        run: |
          cd frontend
          npm run build --if-present

      # ----------------------
      # CREATE ENV ✅
      # ----------------------
      - name: Create env file
        run: |
          mkdir -p infra/infra
          echo "DB_NAME=postgres" > $ENV_FILE
          echo "DB_USER=postgres" >> $ENV_FILE
          echo "DB_PASSWORD=postgres" >> $ENV_FILE
          echo "DB_PORT=5432" >> $ENV_FILE

      # ----------------------
      # DEBUG
      # ----------------------
      - name: Debug env
        run: |
          cat $ENV_FILE

      # ----------------------
      # DOCKER BUILD
      # ----------------------
      - name: Docker build
        run: |
          docker compose --env-file $ENV_FILE -f $DOCKER_COMPOSE_FILE build

      # ----------------------
      # RUN
      # ----------------------
      - name: Docker up
        run: |
          docker compose --env-file $ENV_FILE -f $DOCKER_COMPOSE_FILE up -d

      - name: Check containers
        run: docker ps

      - name: Docker down
        run: |
          docker compose -f $DOCKER_COMPOSE_FILE down
