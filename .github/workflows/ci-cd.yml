name: CI/CD VISTA (DEV IBRAHIM)

on:
  push:
    branches:
      - dev-ibrahim
  workflow_dispatch:

env:
  DOCKER_COMPOSE_FILE: ./infra/infra/docker/docker-compose.yml
  ENV_FILE: ./infra/.env

jobs:

  ci:
    runs-on: ubuntu-latest

    steps:
      # ----------------------
      # CHECKOUT
      # ----------------------
      - name: Checkout repository
        uses: actions/checkout@v3

      # ----------------------
      # FRONTEND
      # ----------------------
      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Install frontend
        run: |
          cd frontend
          npm install --legacy-peer-deps

      - name: Build frontend
        run: |
          cd frontend
          npm run build --if-present

      # ----------------------
      # ENV
      # ----------------------
      - name: Create env file
        run: |
          mkdir -p infra
          echo "DB_NAME=postgres" > $ENV_FILE
          echo "DB_USER=postgres" >> $ENV_FILE
          echo "DB_PASSWORD=postgres" >> $ENV_FILE
          echo "DB_PORT=5432" >> $ENV_FILE

      # ----------------------
      # DOCKER BUILD
      # ----------------------
      - name: Docker build
        run: |
          docker compose \
            --env-file $ENV_FILE \
            -f $DOCKER_COMPOSE_FILE \
            build

      # ----------------------
      # DOCKER UP
      # ----------------------
      - name: Docker up
        run: |
          docker compose \
            --env-file $ENV_FILE \
            -f $DOCKER_COMPOSE_FILE \
            up -d

      # ----------------------
      # CHECK CONTAINERS
      # ----------------------
      - name: Check containers running
        run: |
          docker ps
          docker ps | grep "Up" || exit 1

      # ----------------------
      # WAIT (plus safe)
      # ----------------------
      - name: Wait for services
        run: sleep 20

      # ----------------------
      # LOGS
      # ----------------------
      - name: Show logs
        run: |
          docker compose \
            --env-file $ENV_FILE \
            -f $DOCKER_COMPOSE_FILE \
            logs

      # ----------------------
      # TEST API (strict)
      # ----------------------
      - name: Test API
        run: |
          curl -f http://localhost:8000

      # ----------------------
      # TEST FRONT
      # ----------------------
      - name: Test Frontend
        run: |
          curl -f http://localhost:4200

      # ----------------------
      # CLEAN
      # ----------------------
      - name: Docker down
        if: always()
        run: |
          docker compose \
            --env-file $ENV_FILE \
            -f $DOCKER_COMPOSE_FILE \
            down
