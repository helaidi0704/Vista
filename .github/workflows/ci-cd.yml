name: VISTA CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PROJECT_ID: ai-use-cases-486914
  REGION: europe-west4
  REGISTRY: europe-west4-docker.pkg.dev/ai-use-cases-486914/vista-repo
  GKE_CLUSTER: vista-cluster
  GKE_ZONE: europe-west4-a

jobs:
  # ═══════════════════════════════════════════════════════════
  # JOB 1: Lint & Test
  # ═══════════════════════════════════════════════════════════
  test:
    name: "🧪 Run Tests"
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: vista
          POSTGRES_PASSWORD: vista_test
          POSTGRES_DB: vista_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov httpx

      - name: Run unit tests
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_USER: vista
          POSTGRES_PASSWORD: vista_test
          POSTGRES_DB: vista_test
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: test-secret-key
        run: |
          cd backend
          python -m pytest tests/ -v --cov=app --cov-report=term-missing --cov-report=xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: backend/coverage.xml

  # ═══════════════════════════════════════════════════════════
  # JOB 2: Build & Push Docker Images
  # ═══════════════════════════════════════════════════════════
  build:
    name: "🐳 Build & Push Images"
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev

      - name: Build and push API image
        run: |
          docker build -t ${{ env.REGISTRY }}/vista-api:${{ github.sha }} -t ${{ env.REGISTRY }}/vista-api:latest ./backend
          docker push ${{ env.REGISTRY }}/vista-api:${{ github.sha }}
          docker push ${{ env.REGISTRY }}/vista-api:latest

      - name: Build and push UI image
        run: |
          docker build -t ${{ env.REGISTRY }}/vista-ui:${{ github.sha }} -t ${{ env.REGISTRY }}/vista-ui:latest ./frontend
          docker push ${{ env.REGISTRY }}/vista-ui:${{ github.sha }}
          docker push ${{ env.REGISTRY }}/vista-ui:latest

      - name: Build and push GPU Worker image
        run: |
          docker build -t ${{ env.REGISTRY }}/vista-worker-gpu:${{ github.sha }} -t ${{ env.REGISTRY }}/vista-worker-gpu:latest ./worker-gpu
          docker push ${{ env.REGISTRY }}/vista-worker-gpu:${{ github.sha }}
          docker push ${{ env.REGISTRY }}/vista-worker-gpu:latest

      - name: Build and push CPU Worker image
        run: |
          docker build -t ${{ env.REGISTRY }}/vista-worker-cpu:${{ github.sha }} -t ${{ env.REGISTRY }}/vista-worker-cpu:latest ./worker-cpu
          docker push ${{ env.REGISTRY }}/vista-worker-cpu:${{ github.sha }}
          docker push ${{ env.REGISTRY }}/vista-worker-cpu:latest

      - name: Build and push MLflow image
        run: |
          docker build -t ${{ env.REGISTRY }}/vista-mlflow:${{ github.sha }} -t ${{ env.REGISTRY }}/vista-mlflow:latest ./mlflow
          docker push ${{ env.REGISTRY }}/vista-mlflow:${{ github.sha }}
          docker push ${{ env.REGISTRY }}/vista-mlflow:latest

  # ═══════════════════════════════════════════════════════════
  # JOB 3: Deploy to GKE
  # ═══════════════════════════════════════════════════════════
  deploy:
    name: "☸️ Deploy to GKE"
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ env.GKE_CLUSTER }}
          location: ${{ env.GKE_ZONE }}
          project_id: ${{ env.PROJECT_ID }}

      - name: Deploy to Kubernetes
        run: |
          # Apply all manifests
          kubectl apply -f k8s/00-namespace.yaml
          kubectl apply -f k8s/01-secrets.yaml
          kubectl apply -f k8s/05-configmap.yaml
          kubectl apply -f k8s/02-postgres.yaml
          kubectl apply -f k8s/03-redis.yaml
          kubectl apply -f k8s/04-minio.yaml
          kubectl apply -f k8s/06-api.yaml
          kubectl apply -f k8s/07-worker-gpu.yaml
          kubectl apply -f k8s/08-worker-cpu.yaml
          kubectl apply -f k8s/09-mlflow.yaml
          kubectl apply -f k8s/10-ui.yaml
          
          # Update images to latest
          kubectl set image deployment/api api=${{ env.REGISTRY }}/vista-api:${{ github.sha }} -n vista
          kubectl set image deployment/ui ui=${{ env.REGISTRY }}/vista-ui:${{ github.sha }} -n vista
          kubectl set image deployment/worker-gpu worker-gpu=${{ env.REGISTRY }}/vista-worker-gpu:${{ github.sha }} -n vista
          kubectl set image deployment/worker-cpu worker-cpu=${{ env.REGISTRY }}/vista-worker-cpu:${{ github.sha }} -n vista
          kubectl set image deployment/mlflow mlflow=${{ env.REGISTRY }}/vista-mlflow:${{ github.sha }} -n vista
          
          # Wait for rollout
          kubectl rollout status deployment/api -n vista --timeout=300s
          kubectl rollout status deployment/ui -n vista --timeout=300s

      - name: Verify deployment
        run: |
          echo "=== Pod Status ==="
          kubectl get pods -n vista
          echo "=== Services ==="
          kubectl get services -n vista
