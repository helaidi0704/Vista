name: CI/CD VISTA (DEV IBRAHIM)

on:
  push:
    branches:
      - dev-ibrahim
  pull_request:
    branches:
      - dev-ibrahim
  workflow_dispatch:

env:
  DOCKER_COMPOSE_FILE: infra/docker/docker-compose.yml

jobs:

  ci:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      # ----------------------
      # CHECKOUT
      # ----------------------
      - name: Checkout repository
        uses: actions/checkout@v3

      # ----------------------
      # FRONTEND (Angular)
      # ----------------------
      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm install --legacy-peer-deps

      - name: Build frontend
        run: |
          cd frontend
          npm run build --if-present

      # ----------------------
      # CREATE .env
      # ----------------------
      - name: Create .env file
        run: |
          echo "POSTGRES_DB=postgres" >> .env
          echo "POSTGRES_USER=postgres" >> .env
          echo "POSTGRES_PASSWORD=postgres" >> .env
          echo "REDIS_HOST=redis" >> .env
          echo "API_ENV=ci" >> .env

      # ----------------------
      # DOCKER BUILD
      # ----------------------
      - name: Build Docker images
        run: |
          docker-compose --env-file .env -f $DOCKER_COMPOSE_FILE build

      # ----------------------
      # RUN CONTAINERS
      # ----------------------
      - name: Run containers
        run: |
          docker-compose --env-file .env -f $DOCKER_COMPOSE_FILE up -d

      - name: Check containers
        run: docker ps

      # ----------------------
      # STOP CONTAINERS
      # ----------------------
      - name: Stop containers
        run: |
          docker-compose -f $DOCKER_COMPOSE_FILE down

  deploy:
    name: Deploy désactivé
    runs-on: ubuntu-latest

    if: github.ref == 'refs/heads/develop'

    steps:
      - name: Skip deploy
        run: echo "Déploiement désactivé"
