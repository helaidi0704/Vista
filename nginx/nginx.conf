upstream vista_ui { server vista-ui:3000; }
upstream vista_api { server vista-api:8000; }

server {
    listen 80;
    server_name _;
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name _;

    ssl_certificate     /etc/nginx/ssl/vista.crt;
    ssl_certificate_key /etc/nginx/ssl/vista.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header X-Frame-Options SAMEORIGIN;
    add_header X-Content-Type-Options nosniff;
    add_header Strict-Transport-Security "max-age=31536000" always;
    client_max_body_size 100M;

    location / {
        proxy_pass http://vista_ui;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://vista_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    location /docs { proxy_pass http://vista_api/docs; }
    location /openapi.json { proxy_pass http://vista_api/openapi.json; }
    location /health { proxy_pass http://vista_api/health; }

    location /ws/ {
        proxy_pass http://vista_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400s;
    }
}
