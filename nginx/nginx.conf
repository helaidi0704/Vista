upstream vista_ui { server vista-ui:3000; }
upstream vista_api { server vista-api:8000; }

server {
    listen 80;
    server_name uyunvision.com www.uyunvision.com;
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name uyunvision.com www.uyunvision.com;

    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    add_header X-Frame-Options SAMEORIGIN;
    add_header X-Content-Type-Options nosniff;
    add_header Strict-Transport-Security "max-age=31536000" always;
    client_max_body_size 100M;

    location / {
        proxy_pass http://vista_ui;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://vista_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    location /docs { proxy_pass http://vista_api/docs; }
    location /openapi.json { proxy_pass http://vista_api/openapi.json; }
    location /health { proxy_pass http://vista_api/health; }

    location /ws/ {
        proxy_pass http://vista_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400s;
    }

    # MinIO proxy — serves images via HTTPS
    location /s3/ {
        rewrite ^/s3/(.*) /$1 break;
        proxy_pass http://vista-minio:9000;
        proxy_set_header Host minio:9000;
        proxy_hide_header x-amz-request-id;
        proxy_buffering off;
    }
}
