[project]
name = "backend"
version = "0.1.0"
description = "Minimal FastAPI backend for the VISTA project."
readme = "README.md"
requires-python = ">=3.12.9,<3.14"
dependencies = [
    "fastapi[standard]>=0.115.0",
    "sqlalchemy>=2.0.23",
    "psycopg2-binary>=2.9.9",
    "alembic>=1.13.0",
    "python-dotenv>=1.0.0",
]
[dependency-groups]
dev = [
    "httpx>=0.28.0",
    "pytest>=8.0.0",
    "ruff>=0.11.0",
]
[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions"]
[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP",
    "SIM",
]
ignore = [
    "B008",  # FastAPI's `Depends(...)`/`Header(...)` in argument defaults is the standard idiom
]
[tool.ruff.lint.per-file-ignores]
"alembic/env.py" = ["E402", "I001"]
[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"