services:
  db:
    image: postgres:15
    env_file:
      - ../../.env
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "${DB_PORT}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  api:
    build:
      context: ../../..
      dockerfile: infra/infra/docker/Dockerfile.api
    env_file:
      - ../../.env
    environment:
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ../../apps/api:/app/apps/api

  ui:
    build:
      context: ../../..
      dockerfile: infra/infra/docker/Dockerfile.ui
    env_file:
      - ../../.env
    ports:
      - "4200:4200"
    working_dir: /app
    depends_on:
      - api
    command: sh -c "npm start -- --host 0.0.0.0 --port 4200"

volumes:
  postgres_data:
