version: "3.9"

services:

  # ========================
  # DATABASE (PostgreSQL)
  # ========================
  db:
    image: postgres:15
    container_name: docker-db-1
    env_file:
      - ../../.env
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      retries: 10

  # ========================
  # REDIS
  # ========================
  redis:
    image: redis:7
    container_name: docker-redis-1
    ports:
      - "6379:6379"

  # ========================
  # BACKEND (FastAPI)
  # ========================
  api:
    build:
      context: ../../..
      dockerfile: infra/infra/docker/Dockerfile.api
    container_name: docker-api-1
    env_file:
      - ../../.env
    environment:
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  # ========================
  # FRONTEND (Angular)
  # ========================
  ui:
    build:
      context: ../../..
      dockerfile: infra/infra/docker/Dockerfile.ui
    container_name: docker-ui-1
    working_dir: /app/frontend
    ports:
      - "4200:4200"
    depends_on:
      - api
    command: >
      sh -c "
        echo '📦 Installing frontend deps...' &&
        npm install --legacy-peer-deps &&
        echo '🚀 Starting Angular...' &&
        npx ng serve --host 0.0.0.0 --port 4200 --disable-host-check
      "

  # ========================
  # PLAYWRIGHT
  # ========================
  playwright:
    image: mcr.microsoft.com/playwright/python:v1.60.0-jammy
    container_name: docker-playwright
    working_dir: /app
    volumes:
      - ../../..:/app
    depends_on:
      - ui
      - api
    environment:
      - PYTHONUNBUFFERED=1
      - BASE_URL=http://ui:4200   # ✅ CORRECTION CRITIQUE
    command: >
      sh -c "
        echo '⏳ Waiting for UI (HTTP)...' &&
        until curl -s http://ui:4200 > /dev/null; do
          sleep 3
        done &&
        echo '✅ UI is reachable' &&
        echo '⏳ Waiting Angular build...' &&
        sleep 15 &&
        echo '✅ Running tests' &&
        pip install pytest playwright &&
        pytest -s tests
      "

volumes:
  postgres_data:
