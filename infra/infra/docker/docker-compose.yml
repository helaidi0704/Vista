services:
  db:
    image: postgres:16-alpine
    container_name: vista-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vista}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vista}
      POSTGRES_DB: ${POSTGRES_DB:-vista}
    ports:
      - "5442:5432"
    volumes:
      - vista_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vista} -d ${POSTGRES_DB:-vista}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  vista_db_data:
